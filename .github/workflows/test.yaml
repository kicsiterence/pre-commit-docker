name: "Build docker image"

on: [pull_request]

permissions:
  contents: read

env:
  IMAGE_TAG: pr-test
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CST_VERSION: v1.22.1

# Cancel superseded in-progress runs for the same PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build + test each architecture on its OWN native runner — no QEMU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed docker related files.
        id: get_changed_files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            Dockerfile
            docker.args
            docker-bake.hcl
            scripts/**
            tests/*.yaml

      - name: Compute platform pair.
        if: steps.get_changed_files.outputs.any_changed == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx.
        if: steps.get_changed_files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v4.3.0

      # Tool versions live in docker.args (keeps renovate working). Export them
      # into the environment so the docker-bake.hcl `variable` blocks pick them up.
      - name: Load tool versions from docker.args.
        if: steps.get_changed_files.outputs.any_changed == 'true'
        run: grep -vE '^#|^$' docker.args >> "$GITHUB_ENV"

      # Build the image for THIS runner's native architecture and load it, so the
      # structure and dive tests run against a real native image. The `test` bake
      # target has no fixed platform, so it builds the runner's arch: amd64 on
      # ubuntu-latest, arm64 on ubuntu-24.04-arm. Cache is shared per-arch with the
      # release builds (same layers), so PRs reuse the published image's cache.
      - name: Build native image and load.
        if: steps.get_changed_files.outputs.any_changed == 'true'
        uses: docker/bake-action@v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: test
          load: true
          provenance: false
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CACHE_FROM: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          CACHE_TO: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}

      # Run container-structure-test directly (arch-aware) instead of via the
      # plexsystems action: that action is a Docker action hardcoded to amd64 and
      # fails on the arm64 runner. The CST binary ships both arches.
      - name: Run structure tests.
        if: steps.get_changed_files.outputs.any_changed == 'true'
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
          esac
          bin="$RUNNER_TEMP/container-structure-test"
          curl -fsSL -o "$bin" \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-${arch}"
          chmod +x "$bin"
          "$bin" test \
            --image ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }} \
            --config tests/container-structure-test.yaml

      # Dive checks layer efficiency, which is identical across architectures, so
      # run it once (on amd64) instead of on every matrix leg.
      - name: Dive - check image for waste files.
        if: steps.get_changed_files.outputs.any_changed == 'true' && matrix.platform == 'linux/amd64'
        uses: MaxymVlasov/dive-action@v2.0.1
        with:
          image: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          config-file: ${{ github.workspace }}/tests/dive.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}
