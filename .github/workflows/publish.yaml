name: "Release - build"

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '!tests/**'
      - 'Dockerfile'
      - 'docker.args'
      - 'scripts/**'

jobs:
  release:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU.
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag for image.
        run: |
          echo IMAGE_TAG=$([ ${{ github.ref_type }} == 'tag' ] && echo ${{ github.ref_name }} || echo 'latest') >> $GITHUB_ENV

      # Tool versions live in docker.args (keeps renovate working). Export them
      # into the environment so the docker-bake.hcl `variable` blocks pick them up.
      - name: Load tool versions from docker.args.
        run: grep -vE '^#|^$' docker.args >> "$GITHUB_ENV"

      - name: Build and publish.
        uses: docker/bake-action@v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: release
          push: true
          provenance: false
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CACHE_FROM: type=gha
          CACHE_TO: type=gha,mode=max
