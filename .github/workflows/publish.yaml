name: "Release - build"

# Publishing is driven by releases (see release-please.yaml), which calls this
# workflow with the version tag. It can also be dispatched manually to rebuild
# `latest` from the current branch (e.g. after a base-image CVE with no code
# change). It no longer runs on every master push — the image ships on release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to publish (defaults to 'latest')."
        type: string
        required: false
        default: latest
      ref:
        description: "Git ref to build from (defaults to the triggering ref)."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU.
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tool versions live in docker.args (keeps renovate working). Export them
      # into the environment so the docker-bake.hcl `variable` blocks pick them up.
      - name: Load tool versions from docker.args.
        run: grep -vE '^#|^$' docker.args >> "$GITHUB_ENV"

      - name: Build and publish.
        uses: docker/bake-action@v7.3.0
        with:
          source: .
          files: docker-bake.hcl
          targets: release
          push: true
          provenance: false
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
          CACHE_FROM: type=gha
          CACHE_TO: type=gha,mode=max
